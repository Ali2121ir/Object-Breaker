<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Object Breaker</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
      user-select: none;
    }
    #ui-layer {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      color: white;
      z-index: 10;
    }
    #score { font-size: 24px; font-weight: bold; }
    #difficulty-select {
      font-size: 16px;
      font-weight: bold;
      padding: 5px 10px;
      border: 2px solid black;
      background: white;
      border-radius: 5px;
      cursor: pointer;
    }
    #crown {
      font-size: 32px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 5px;
    }
    #leaderboard-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border: 3px solid black;
      padding: 20px;
      border-radius: 10px;
      width: 280px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 100;
      text-align: center;
    }
    #leaderboard-modal h2 { margin-top: 0; }
    #leaderboard-list {
      text-align: left;
      margin: 15px 0;
      max-height: 200px;
      overflow-y: auto;
      padding-left: 0;
      list-style: none;
    }
    #leaderboard-list li {
      padding: 5px 0;
      border-bottom: 1px solid #eee;
      font-size: 16px;
    }
    #close-btn {
      background: black;
      color: white;
      border: none;
      padding: 8px 15px;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="ui-layer">
    <div id="score">Score: 0</div>
    <div id="right-controls">
      <select id="difficulty-select" onchange="changeDifficulty(this.value)">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
        <option value="extreme">Extreme</option>
      </select>
      <button id="crown">👑</button>
    </div>
  </div>

  <div id="leaderboard-modal">
    <h2>🏆 Global Ranking</h2>
    <ul id="leaderboard-list">Loading...</ul>
    <button id="close-btn" onclick="toggleLeaderboard(false)">Close</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const BIN_ID = "66f3e1aae41b4d34e43702a1";
    const API_KEY = "$2a$10$pL4i9V8g7d2H0D9IqC4H7u41N8xQ/Y4y4/sYdGk2D1V8g7d2H0D9I";
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let score = 0;
    let circles = [];
    let particles = [];
    let spawnTimer = 0;
    let currentDifficulty = "medium";
    let isMouseDown = false;

    const configs = {
      easy: { spawnInterval: 90, forceMin: 5, forceMax: 8, gravity: 0.07 },
      medium: { spawnInterval: 65, forceMin: 7, forceMax: 11, gravity: 0.09 },
      hard: { spawnInterval: 45, forceMin: 9, forceMax: 14, gravity: 0.13 },
      extreme: { spawnInterval: 30, forceMin: 10, forceMax: 16, gravity: 0.15 }
    };

    function changeDifficulty(val) {
      currentDifficulty = val;
    }

    function toggleLeaderboard(show) {
      document.getElementById("leaderboard-modal").style.display = show ? "block" : "none";
    }
    document.getElementById("crown").onclick = () => toggleLeaderboard(true);

    function spawnCircle() {
      const radius = Math.random() * 20 + 20;
      const x = Math.random() * (canvas.width - radius * 2) + radius;
      const y = canvas.height + radius;
      const config = configs[currentDifficulty];
      const vy = -(Math.random() * (config.forceMax - config.forceMin) + config.forceMin);
      const vx = (Math.random() - 0.5) * 4;
      const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6'];
      const color = colors[Math.floor(Math.random() * colors.length)];

      circles.push({ x, y, radius, vx, vy, color });
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 18; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 4 + 2,
          color: color,
          alpha: 1
        });
      }
    }

    function handleInteraction(pos) {
      for (let i = circles.length - 1; i >= 0; i--) {
        const c = circles[i];
        const dist = Math.hypot(pos.x - c.x, pos.y - c.y);
        if (dist < c.radius) {
          createParticles(c.x, c.y, c.color);
          circles.splice(i, 1);
          score += 10;
          document.getElementById("score").innerText = "Score: " + score;
          break;
        }
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      handleInteraction({ x: e.clientX, y: e.clientY });
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isMouseDown) handleInteraction({ x: e.clientX, y: e.clientY });
    });

    canvas.addEventListener('mouseup', () => isMouseDown = false);

    canvas.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      handleInteraction({ x: touch.clientX, y: touch.clientY });
    });

    canvas.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      handleInteraction({ x: touch.clientX, y: touch.clientY });
    });

    function gameLoop() {
      ctx.fillStyle = "rgba(17, 17, 17, 0.3)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const config = configs[currentDifficulty];
      spawnTimer++;
      if (spawnTimer >= config.spawnInterval) {
        spawnCircle();
        spawnTimer = 0;
      }

      for (let i = circles.length - 1; i >= 0; i--) {
        let c = circles[i];
        c.x += c.vx;
        c.y += c.vy;
        c.vy += config.gravity;

        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fill();

        if (c.y - c.radius > canvas.height + 50) {
          circles.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.025;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
