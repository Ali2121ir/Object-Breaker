<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object Breaker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0e15;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1a1c29 0%, #0d0e15 100%);
    }
    #ui-layer {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      pointer-events: none;
      z-index: 10;
    }
    #score-container {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    #right-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      pointer-events: auto;
    }
    #difficulty-select {
      font-size: 15px;
      font-weight: bold;
      padding: 8px 12px;
      border: 2px solid #3d425c;
      background: #1e2130;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      outline: none;
    }
    #crown {
      font-size: 26px;
      cursor: pointer;
      background: #1e2130;
      border: 2px solid #3d425c;
      border-radius: 8px;
      padding: 4px 10px;
      transition: transform 0.1s ease;
    }
    #crown:active {
      transform: scale(0.95);
    }
    #leaderboard-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1e2130;
      border: 2px solid #3d425c;
      padding: 24px;
      border-radius: 14px;
      width: 300px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 100;
      text-align: center;
      color: white;
    }
    #leaderboard-modal h2 { margin-bottom: 15px; }
    #leaderboard-list {
      text-align: left;
      margin: 15px 0;
      max-height: 200px;
      overflow-y: auto;
      padding-left: 0;
      list-style: none;
    }
    #leaderboard-list li {
      padding: 8px 0;
      border-bottom: 1px solid #2a2e45;
      font-size: 15px;
    }
    #close-btn {
      background: #ff4757;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div id="ui-layer">
    <div id="score-container">Score: <span id="score">0</span></div>
    <div id="right-controls">
      <select id="difficulty-select" onchange="changeDifficulty(this.value)">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
        <option value="extreme">Extreme</option>
      </select>
      <button id="crown">👑</button>
    </div>
  </div>

  <div id="leaderboard-modal">
    <h2>🏆 Global Ranking</h2>
    <ul id="leaderboard-list">
      <li>1. Player1 - 1200</li>
      <li>2. Player2 - 950</li>
      <li>3. Player3 - 800</li>
    </ul>
    <button id="close-btn" onclick="toggleLeaderboard(false)">Close</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let score = 0;
    let circles = [];
    let particles = [];
    let spawnTimer = 0;
    let currentDifficulty = "medium";
    let isInteracting = false;

    const configs = {
      easy: { spawnInterval: 80, forceMin: 6, forceMax: 9, gravity: 0.08 },
      medium: { spawnInterval: 60, forceMin: 8, forceMax: 12, gravity: 0.1 },
      hard: { spawnInterval: 40, forceMin: 10, forceMax: 15, gravity: 0.14 },
      extreme: { spawnInterval: 25, forceMin: 12, forceMax: 18, gravity: 0.17 }
    };

    function changeDifficulty(val) {
      currentDifficulty = val;
    }

    function toggleLeaderboard(show) {
      document.getElementById("leaderboard-modal").style.display = show ? "block" : "none";
    }
    document.getElementById("crown").onclick = () => toggleLeaderboard(true);

    function spawnCircle() {
      const radius = Math.random() * 20 + 25;
      const x = Math.random() * (canvas.width - radius * 2) + radius;
      const y = canvas.height + radius;
      const config = configs[currentDifficulty];
      const vy = -(Math.random() * (config.forceMax - config.forceMin) + config.forceMin);
      const vx = (Math.random() - 0.5) * 4;
      const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#ff6b81'];
      const color = colors[Math.floor(Math.random() * colors.length)];

      circles.push({ x, y, radius, vx, vy, color });
    }

    // FIXED PARTICLE SYSTEM: Explodes particles outward from circle smash point
    function createParticles(x, y, color) {
      const particleCount = 20;
      for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 4 + 2,
          color: color,
          alpha: 1
        });
      }
    }

    function handleInteraction(pos) {
      for (let i = circles.length - 1; i >= 0; i--) {
        const c = circles[i];
        const dist = Math.hypot(pos.x - c.x, pos.y - c.y);
        if (dist <= c.radius + 10) {
          createParticles(c.x, c.y, c.color);
          circles.splice(i, 1);
          score += 10;
          document.getElementById("score").innerText = score;
          break;
        }
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      isInteracting = true;
      handleInteraction({ x: e.clientX, y: e.clientY });
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isInteracting) handleInteraction({ x: e.clientX, y: e.clientY });
    });

    canvas.addEventListener('mouseup', () => isInteracting = false);

    canvas.addEventListener('touchstart', (e) => {
      isInteracting = true;
      const touch = e.touches[0];
      handleInteraction({ x: touch.clientX, y: touch.clientY });
    });

    canvas.addEventListener('touchmove', (e) => {
      if (isInteracting) {
        const touch = e.touches[0];
        handleInteraction({ x: touch.clientX, y: touch.clientY });
      }
    });

    canvas.addEventListener('touchend', () => isInteracting = false);

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const config = configs[currentDifficulty];
      spawnTimer++;
      if (spawnTimer >= config.spawnInterval) {
        spawnCircle();
        spawnTimer = 0;
      }

      // Render and update Circles
      for (let i = circles.length - 1; i >= 0; i--) {
        let c = circles[i];
        c.x += c.vx;
        c.y += c.vy;
        c.vy += config.gravity;

        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fill();

        if (c.y - c.radius > canvas.height + 50) {
          circles.splice(i, 1);
        }
      }

      // Render and update Particles correctly
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.025;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
